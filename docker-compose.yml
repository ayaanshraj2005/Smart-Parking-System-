version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: parknow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-parknow_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD:-rootpassword} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./parknow-backend
      dockerfile: Dockerfile
    container_name: parknow-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysqldb:3306/${DB_NAME:-parknow_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      mysqldb:
        condition: service_healthy

  frontend:
    build:
      context: ./parknow-frontend
      dockerfile: Dockerfile
    container_name: parknow-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - backend

volumes:
  mysql_data:
